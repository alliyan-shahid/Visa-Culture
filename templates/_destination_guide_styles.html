  /* Final Visa Culture theme alignment: the guide should feel like part of the homepage, not a separate microsite. */
  .au-guide { background:#fbfaf8; color:#17151c; }

  .au-guide__glance { border-top-color:#d5a85e; }

  .au-guide__button { border-radius:999px; border-color:#d5a85e; background:#d5a85e; color:#15131b; box-shadow:0 .7rem 1.4rem rgba(0,0,0,.18); }

  .au-guide__heading { font-size:clamp(2rem,3.8vw,3.5rem); line-height:1; }

  /* Full-bleed treatment used by the homepage's major colour sections. */
  .au-guide__hero,
  .au-guide__band { width:100vw; margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); padding-left:max(1.1rem,calc((100vw - 78rem) / 2 + 3rem)); padding-right:max(1.1rem,calc((100vw - 78rem) / 2 + 3rem)); }
  .au-guide__hero { padding-top:20px; }

  .au-guide__settle-intro { display:block; min-height:0; }

  /* Single fixed destination hero image: homepage framing without carousel movement. */
  .au-guide__hero { min-height:clamp(36rem,72vh,48rem); background-color:transparent; background-image:url("{{ url_for('static', filename=desktop_hero) }}"); background-position:center; background-size:cover; background-repeat:no-repeat; background-blend-mode:normal; filter:none; box-shadow:none; }
