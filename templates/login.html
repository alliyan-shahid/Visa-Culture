{% extends 'base.html' %}

{% block title %}Login | Visa Culture{% endblock %}

{% block content %}
<section class="bg-slate-50 py-24">
    <div class="mx-auto max-w-3xl px-6">
        <div class="rounded-[2rem] bg-white p-10 shadow-soft">
            <div class="mb-8">
                <p class="text-sm uppercase tracking-[0.35em] text-primary">Sign in</p>
                <h1 class="mt-3 text-3xl font-bold text-slate-950">Login page</h1>
                <p class="mt-3 text-slate-600">This is a frontend-only login screen. Authentication is not active on the backend.</p>
            </div>
            <form class="space-y-6">
                <label class="space-y-2 text-sm font-semibold text-slate-700" for="email">
                    <span>Email address</span>
                    <input id="email" name="email" type="email" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-5 py-3 text-slate-900 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" placeholder="name@example.com">
                </label>
                <label class="space-y-2 text-sm font-semibold text-slate-700" for="password">
                    <span>Password</span>
                    <input id="password" name="password" type="password" class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-5 py-3 text-slate-900 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20" placeholder="Enter your password">
                </label>
                <button type="button" class="w-full rounded-3xl bg-primary px-6 py-4 text-sm font-semibold text-white transition hover:bg-slate-900">Login</button>
                <p class="text-center text-sm text-slate-500">Back to <a href="/" class="text-primary underline">landing page</a></p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
