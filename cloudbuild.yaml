steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_IMAGE_URI}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_IMAGE_URI}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_IMAGE_URI}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--set-env-vars=DB_URI=${_DB_URI}"
      - "--set-env-vars=FORCE_ONLINE_DB=${_FORCE_ONLINE_DB}"
      - "--set-env-vars=SECRET_KEY=${_SECRET_KEY}"
      - "--set-env-vars=ADMIN_PASSWORD=${_ADMIN_PASSWORD}"
      - "--set-env-vars=DEVELOPER_EMAIL=${_DEVELOPER_EMAIL}"
      - "--set-env-vars=DEVELOPER_PASSWORD=${_DEVELOPER_PASSWORD}"
      - "--set-env-vars=SMTP_HOST=${_SMTP_HOST}"
      - "--set-env-vars=SMTP_PORT=${_SMTP_PORT}"
      - "--set-env-vars=SMTP_USER=${_SMTP_USER}"
      - "--set-env-vars=^|^BOOKING_RECIPIENTS=${_BOOKING_RECIPIENTS}"
      - "--set-env-vars=SMTP_PASSWORD=${_SMTP_PASSWORD}"

substitutions:
  _REGION: "asia-southeast1"
  _SERVICE_NAME: "visa-culture"
  _REPOSITORY: "cloud-run-source-deploy"
  _IMAGE_NAME: "visa-culture"
  _IMAGE_URI: "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}"
  _DB_URI: "***Removed***"
  _FORCE_ONLINE_DB: "true"
  _SECRET_KEY: "***Removed***"
  _ADMIN_PASSWORD: "***Removed***"
  _DEVELOPER_EMAIL: "***Removed***"
  _DEVELOPER_PASSWORD: "***Removed***"
  _SMTP_HOST: "***Removed***"
  _SMTP_PORT: "***Removed***"
  _SMTP_USER: "***Removed***"
  _SMTP_PASSWORD: "***Removed***"
  _BOOKING_RECIPIENTS: "***Removed***"

options:
  logging: CLOUD_LOGGING_ONLY
